[project]
name = "cocoa"
version = "0.1.0"
description = "COCOA: 지연·취소 보정 Neural-Linear Thompson Sampling 기반 제휴 상품·노출 위치 선택 연구"
readme = "README.md"
requires-python = ">=3.9,<3.11"  # obp(zr-obp) 최신 버전이 3.11 미만을 요구함. 설치 시 실제 obp 배포본으로 재검증할 것 (T0.1)
license = { text = "Proprietary" }

dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "torch",
    "obp",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
