[project]
name = "cocoa"
version = "0.1.0"
description = "COCOA: 지연·취소 보정 Neural-Linear Thompson Sampling 기반 제휴 상품·노출 위치 선택 연구"
readme = "README.md"
requires-python = ">=3.11"  # T0.1: 3.11/3.13/3.14에서 obp==0.4.1 설치·스모크테스트 검증 완료. 3.9/3.10은 미검증(아래 주석 참고)
license = { text = "Proprietary" }

dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "torch",
    # obp 0.5.x는 torch==1.12.0에 하드 고정되어 있어 cp311+ 휠이 없고,
    # 버전 미지정 시 환경에 따라 pip가 (구형 torch가 설치 가능한 3.9/3.10에서는)
    # obp 0.5.x를 선택해버릴 수 있다. 재현성을 위해 0.5 미만으로 명시 고정한다.
    "obp>=0.4.1,<0.5",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
